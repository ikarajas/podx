[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podx"
version = "0.1.0"
description = "A minimal command-line tool named podx."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # Apple MLX-based Whisper: only available on macOS arm64
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Cross-platform Whisper CLI as a fallback elsewhere
  "openai-whisper; sys_platform != 'darwin' or platform_machine != 'arm64'",
  "PyYAML",
  "mutagen",
  "PyQt6"
]

[project.scripts]
podx = "podx.cli:main"

[project.urls]
Homepage = "https://example.com"
Repository = "https://example.com/your-repo"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
faster = [
  "faster-whisper",
  # OpenVINO enables Intel GPU acceleration via CTranslate2 when available.
  "openvino; platform_system == 'Windows' or platform_system == 'Linux'"
]
# LLM summarisation providers (install only the one you need)
gemini = ["google-generativeai"]
anthropic = ["anthropic"]
openai = ["openai"]
# ollama: no extra package needed — uses urllib from the standard library
